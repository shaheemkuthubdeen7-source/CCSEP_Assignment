<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      gap: 0.75rem;
    }
    .login-logo .logo-badge {
      width: 52px;
      height: 52px;
    }
    .login-logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .login-logo p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Sign In</span>
          <span class="brand-subtitle">Access your account</span>
        </div>
      </div>
      <div class="nav-meta">
        <span class="meta-tag status-pill" id="system-status-indicator">
          <span class="status-dot"></span> System Online
        </span>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to your account to continue</p>
      </div>

      <div class="glass-card">
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-username" class="form-label">Username</label>
            <input type="text" id="login-username" class="form-input" placeholder="Enter your username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <button type="submit" id="btn-submit-login" class="btn btn-primary">
            <span id="btn-login-spinner" class="spinner hidden"></span>
            Sign In
          </button>
        </form>
        <div id="login-result" class="result-box hidden"></div>
      </div>

      <!-- Test Accounts Table -->
      <div class="glass-card" style="margin-top: 1rem;">
        <div class="card-header">
          <h2 class="card-title" style="font-size:0.95rem;">Test Accounts</h2>
          
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:0.5rem;">
          <thead>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.08);">
              <th style="text-align:left; padding:0.5rem 0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em;">Username</th>
              <th style="text-align:left; padding:0.5rem 0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em;">Password</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer;" onclick="fillCredentials('alice_admin','AdminSecret#2026')" onmouseover="this.style.background='rgba(99,102,241,0.08)'" onmouseout="this.style.background='transparent'">
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#e2e8f0;">alice_admin</td>
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#94a3b8;">AdminSecret#2026</td>
            </tr>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer;" onclick="fillCredentials('bob_analyst','AuditPass!99')" onmouseover="this.style.background='rgba(99,102,241,0.08)'" onmouseout="this.style.background='transparent'">
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#e2e8f0;">bob_analyst</td>
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#94a3b8;">AuditPass!99</td>
            </tr>
            <tr style="cursor:pointer;" onclick="fillCredentials('charlie_guest','GuestWelcome123')" onmouseover="this.style.background='rgba(99,102,241,0.08)'" onmouseout="this.style.background='transparent'">
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#e2e8f0;">charlie_guest</td>
              <td style="padding:0.55rem 0.75rem; font-family:var(--font-mono); color:#94a3b8;">GuestWelcome123</td>
            </tr>
          </tbody>
        </table>
        <p style="font-size:0.72rem; color:var(--text-muted); margin-top:0.75rem;">Click any row to auto-fill credentials.</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <span>Sign In</span>
      <span>© 2026 All rights reserved</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
